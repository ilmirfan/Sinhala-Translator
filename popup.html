<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English to Sinhala Translator</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <img src="icons/icon48.png" width="34" height="34" alt="Singlish Logo" class="brand-logo-img">
        <div class="brand-text">
          <h1>Sinhala Translator</h1>
          <span class="version-tag">EN ➔ SI</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="themeToggleBtn" class="icon-btn" title="Toggle Light/Dark Theme" aria-label="Toggle theme">
          <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Mode Switcher Tabs -->
    <div class="mode-switcher" role="tablist">
      <button id="modeEn2Si" class="mode-tab active" role="tab" aria-selected="true" data-mode="en2si">
        <span>English ➔ Sinhala</span>
      </button>
      <button id="modeSinglish" class="mode-tab" role="tab" aria-selected="false" data-mode="singlish">
        <span>Singlish ➔ Sinhala & English</span>
      </button>
    </div>

    <!-- Source Input Card -->
    <div class="card source-card">
      <div class="card-header">
        <span id="sourceLangLabel" class="lang-label">
          <span class="flag-icon">🇬🇧</span> English
        </span>
        <div class="card-actions">
          <button id="clearBtn" class="text-btn hidden" title="Clear input text">Clear</button>
        </div>
      </div>
      <div class="input-wrapper">
        <textarea 
          id="sourceText" 
          placeholder="Enter English text here..." 
          rows="3" 
          maxlength="5000"
          autofocus></textarea>
      </div>

      <!-- Word Suggestions (Singlish Phonetic Mode) -->
      <div id="suggestionsWrapper" class="suggestions-wrapper hidden">
        <span class="suggestions-title">Sinhala Word Suggestions:</span>
        <div id="suggestionsList" class="suggestions-list"></div>
      </div>

      <div class="card-footer">
        <span id="charCount" class="char-count">0 / 5000</span>
        <div id="statusIndicator" class="status-indicator hidden">
          <span class="spinner"></span> <span id="statusText">Translating...</span>
        </div>
      </div>
    </div>

    <!-- Divider / Action Bar -->
    <div class="divider-bar">
      <button id="translateBtn" class="primary-btn" title="Click to translate">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
        <span id="translateBtnText">Translate</span>
      </button>
    </div>

    <!-- Output Card -->
    <div class="card output-card">
      <div class="card-header">
        <span id="targetLangLabel" class="lang-label">
          <span class="flag-icon">🇱🇰</span> Sinhala (සිංහල)
        </span>
        <div class="card-actions">
          <button id="speakBtn" class="icon-btn hidden" title="Listen pronunciation" aria-label="Listen">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
          </button>
          <button id="copyBtn" class="icon-btn copy-btn" title="Copy text to clipboard" aria-label="Copy text" disabled>
            <svg class="copy-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <svg class="check-icon hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <span class="btn-text">Copy</span>
          </button>
        </div>
      </div>

      <!-- Identified Sinhala Word (In Singlish mode) -->
      <div id="identifiedWordWrapper" class="identified-word-wrapper hidden">
        <span class="identified-label">Identified Sinhala Word:</span>
        <div id="identifiedWord" class="identified-word"></div>
      </div>

      <div id="targetContainer" class="output-wrapper">
        <div id="targetText" class="target-text placeholder-state" dir="ltr">
          Translation will appear here...
        </div>
      </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast hidden">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      <span id="toastMessage">Copied to clipboard!</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
